# Dev toolchain, run directly in WSL (no devcontainer). Exact versions pinned.
#   mise install && mise run bootstrap     # once per machine
# `go test -race` needs a system C compiler; e2e needs Chromium system libs (sudo apt install build-essential, sudo ./frontend/node_modules/.bin/playwright install-deps chromium).

[tools]
go = "1.25.14"
node = "24.21.0"            # vite, eslint, playwright run on node; bun is the package manager
bun = "1.4.3"
golangci-lint = "2.15.0"
gofumpt = "0.12.0"
sqlc = "1.31.1"
prek = "0.5.5"
"go:golang.org/x/tools/gopls" = "0.24.0"
"npm:typescript" = "5.9.3"
"npm:typescript-language-server" = "6.0.2"

[settings]
lockfile = true

[tasks.bootstrap]
description = "Install git hooks and project dependencies"
run = """
set -e
prek install
mise run deps
"""

[tasks.deps]
description = "Download Go modules, install frontend deps and the pinned Playwright Chromium"
run = """
set -e
(cd backend && go mod download)
(cd frontend && bun install --frozen-lockfile && ./node_modules/.bin/playwright install chromium)
mise run lsp
"""

[tasks.lsp]
description = "Let Claude Code's gopls/typescript LSP servers (started at the repo root) find the backend module and frontend typescript"
run = """
set -e
[ -f go.work ] || go work init ./backend
[ -e node_modules ] || ln -s frontend/node_modules node_modules
"""
