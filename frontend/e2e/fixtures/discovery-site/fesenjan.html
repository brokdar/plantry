<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fesenjan</title>
    <meta property="og:image" content="{{SITE}}/img/fesenjan.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Recipe",
        "name": "Fesenjan",
        "description": "Persian chicken stew with walnuts and pomegranate.",
        "recipeYield": "4 servings",
        "prepTime": "PT15M",
        "cookTime": "PT45M",
        "totalTime": "PT1H",
        "recipeIngredient": [
          "800 g Chicken thighs",
          "200 g Walnut halves",
          "150 g Yellow onion",
          "60 g Pomegranate molasses",
          "5 g Sumac",
          "300 g Basmati rice",
          "30 g Butter",
          "5 g Sea salt"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Toast and grind the walnuts." },
          {
            "@type": "HowToStep",
            "text": "Brown the onion and chicken in butter."
          },
          {
            "@type": "HowToStep",
            "text": "Simmer with the walnuts and pomegranate molasses for 40 minutes."
          },
          {
            "@type": "HowToStep",
            "text": "Serve over the cooked rice, dusted with sumac."
          }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Fesenjan</h1>
  </body>
</html>
