<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buttered onion spaghetti</title>
    <meta property="og:image" content="{{SITE}}/img/pasta.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Recipe",
        "name": "Buttered onion spaghetti",
        "description": "A quick pantry pasta.",
        "recipeYield": "2 servings",
        "totalTime": "PT25M",
        "recipeIngredient": [
          "250 g Spaghetti",
          "150 g Yellow onion",
          "40 g Butter",
          "5 g Sea salt"
        ],
        "recipeInstructions": [
          {
            "@type": "HowToStep",
            "text": "Boil the spaghetti in salted water."
          },
          {
            "@type": "HowToStep",
            "text": "Fry the onion in butter until golden."
          },
          { "@type": "HowToStep", "text": "Toss together and serve." }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Buttered onion spaghetti</h1>
  </body>
</html>
