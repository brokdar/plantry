minimum_prek_version = "0.3.8"

# No global `exclude`: it would also filter the secret hooks. Vendored
# third-party skills stay byte-identical to upstream (see skills-lock.json), so
# only the formatting/lint hooks below skip ^\.claude/skills/; every secret hook
# and detect-private-key sees those files.

# ── Builtin (Rust-native, instant, zero deps) ─────────────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "no-commit-to-branch", args = ["-b", "main"] },
  { id = "detect-private-key" },
  { id = "check-added-large-files", args = ["--maxkb=500"], exclude = "^\\.claude/skills/" },
  { id = "check-merge-conflict", exclude = "^\\.claude/skills/" },
  { id = "trailing-whitespace", exclude = "^\\.claude/skills/" },
  { id = "end-of-file-fixer", exclude = "^\\.claude/skills/" },
  { id = "check-yaml", exclude = "^\\.claude/skills/" },
  { id = "check-toml", exclude = "^\\.claude/skills/" },
  # tsconfig files use JSONC (comments) — exclude them
  { id = "check-json", exclude = "tsconfig|^\\.claude/skills/" },
]

# Full test suites run in scripts/gate.sh (once per PR), not on every commit.
# ── Local system hooks ────────────────────────────────────────────────────────
[[repos]]
repo = "local"
hooks = [
  # gofumpt: pinned in mise.toml, auto-fixes
  {
    id             = "gofumpt",
    name           = "gofumpt",
    language       = "system",
    entry          = "gofumpt",
    args           = ["-w"],
    files          = "^backend/.*\\.go$",
    pass_filenames = true,
  },

  # golangci-lint: run from backend/ to pick up the module root
  # Install: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  {
    id             = "golangci-lint",
    name           = "golangci-lint",
    language       = "system",
    entry          = "bash -c 'cd backend && golangci-lint run --config .golangci.yml --new-from-rev HEAD'",
    files          = "^backend/.*\\.go$",
    pass_filenames = false,
  },

  # go mod tidy: runs tidy then fails if go.mod/go.sum changed
  {
    id             = "go-mod-tidy",
    name           = "go mod tidy (drift check)",
    language       = "system",
    entry          = "bash -c 'cd backend && go mod tidy && git diff --exit-code go.mod go.sum'",
    files          = "^backend/",
    pass_filenames = false,
  },

  # Prettier: auto-fixes TS/TSX/CSS; git blocks commit if files were reformatted
  {
    id             = "prettier",
    name           = "Prettier",
    language       = "system",
    entry          = "bash -c 'cd frontend && bunx prettier --write .'",
    files          = "^frontend/src/.*\\.(ts|tsx|css)$",
    pass_filenames = false,
  },

  # ESLint: check-only (real lint errors surface here)
  {
    id             = "eslint",
    name           = "ESLint",
    language       = "system",
    entry          = "bash -c 'cd frontend && bun run lint'",
    files          = "^frontend/src/.*\\.(ts|tsx)$",
    pass_filenames = false,
  },

  # ── Secret prevention (layer 1 of "Secrets" in CLAUDE.md) ──────────────────
  # gitleaks over the staged diff, pinned in mise.toml, rules in .gitleaks.toml
  {
    id             = "gitleaks",
    name           = "gitleaks (staged)",
    language       = "system",
    entry          = "bash scripts/secret-guard.sh staged",
    stages         = ["pre-commit"],
    always_run     = true,
    pass_filenames = false,
  },

  # blocked file names (.env, secret.key, keys, local settings), DBs outside
  # testdata, and the SQLite credential check on every staged DB
  {
    id             = "secret-files",
    name           = "blocked files + DB credential check",
    language       = "system",
    entry          = "bash scripts/secret-guard.sh files",
    stages         = ["pre-commit"],
    pass_filenames = true,
  },

]

# ── Push stage: scan every commit being pushed (catches --no-verify commits) ──
[[repos]]
repo = "local"
hooks = [
  {
    id             = "secret-push-scan",
    name           = "gitleaks + DB check over pushed commits",
    language       = "system",
    entry          = "bash scripts/secret-guard.sh push",
    stages         = ["pre-push"],
    always_run     = true,
    pass_filenames = false,
  },
]
