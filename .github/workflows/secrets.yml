name: Secrets

# Last layer of secret prevention ("Secrets" in CLAUDE.md): a commit made with
# --no-verify still fails here. No path filter and every branch/PR/tag, so
# stacked PRs and tags are covered. Scans the FULL history, not just the diff.

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal the gitleaks pin in mise.toml (checked below). SHA-256 is of the
  # linux_x64 tarball and matches the release's gitleaks_8.30.1_checksums.txt.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: gitleaks (full history) and fixture DB check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow pin matches mise.toml
        run: grep -qE "^gitleaks = \"${GITLEAKS_VERSION}\"" mise.toml
      - name: Install pinned gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks over all history
        run: gitleaks git --redact --no-banner --log-opts=--all .
      - name: Fixture DB credential check (every tracked DB)
        run: python3 -I scripts/check-db-secrets.py --tracked
      - name: Blocked file names (every tracked file)
        run: git ls-files -z | xargs -0 scripts/secret-guard.sh files
