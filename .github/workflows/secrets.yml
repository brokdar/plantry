name: Secrets

# Detective layer of secret prevention ("Secrets" in CLAUDE.md). CI runs AFTER
# the push, so the preventive layers are the local prek hooks and GitHub push
# protection; this catches what slipped past them.
#
# [skip ci]: GitHub skips push and pull_request workflows when the head commit
# message contains [skip ci], [ci skip], [no ci], [skip actions] or
# [actions skip]. That cannot be switched off, so nothing here may rely on CI
# alone: require the `scan` check on main (ruleset, see CLAUDE.md) so a skipped
# check blocks the merge instead of passing it.
#
# A branch must not weaken its own check. pull_request_target runs THIS file as
# it is on the default branch, and every scan runs the scripts and configs from
# the default branch (checkout `trusted`) over the commits under test (checkout
# `repo`, used as data only, nothing from it is executed). push and
# workflow_dispatch runs use the pushed workflow file, so on those events the
# branch can edit it: only the pull_request_target run is tamper-proof. Findings
# fail every run, never advisory (also in the bootstrap run of the PR that
# introduces this file, which has no trusted copy yet and scans with its own).
# A PR that changes a guard file (scripts/secret-guard-files.txt) fails unless
# the owner sets the label `secret-guard-change`.
#
# No path filter and every branch/PR/tag, so stacked PRs and tags are covered.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal the gitleaks pin in mise.toml (checked below). SHA-256 is of the
  # linux_x64 tarball and matches the release's gitleaks_8.30.1_checksums.txt.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2: the trusted guard files from the default branch
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      # the commits under test: PR head (data only), pushed commit otherwise
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - name: origin/main in the repo under test
        run: |
          set -euo pipefail
          git -C repo fetch --no-tags --quiet \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/main"
      - name: Choose the guard source (trusted copy from the default branch, or bootstrap)
        run: |
          set -euo pipefail
          # Bootstrap: the PR that introduces the guard has no trusted copy
          # yet (no secret-ci.sh and no gitleaks pin on the default branch), so
          # every step uses the branch copy. Not tamper-proof, but not advisory:
          # findings still fail the job.
          if [ -f trusted/scripts/secret-ci.sh ] && [ -f trusted/scripts/secret-guard-selftest.sh ]; then
            echo "GUARD=trusted" >> "$GITHUB_ENV"
          else
            echo "::warning::bootstrap: main has no secret guard yet; using the branch copy"
            echo "GUARD=repo" >> "$GITHUB_ENV"
          fi
      - name: Workflow pin matches mise.toml
        run: grep -qE "^gitleaks = \"${GITLEAKS_VERSION}\"" "$GUARD/mise.toml"
      - name: Install pinned gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan (gitleaks over all history, file checks, guard-file label)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # push: only the commits this push added are checked for binaries and
          # DBs (older history is covered by gitleaks and has reviewed history)
          CI_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'origin/main' }}
        run: |
          set -euo pipefail
          T="$GUARD"
          bash "$T/scripts/secret-ci.sh" repo || { echo "::error::secret scan failed (see the log above); never allowlist a real secret, rotate it"; exit 1; }
      - name: Guard self-tests (hook tests, bypass replays with fake keys)
        run: |
          set -euo pipefail
          T="$GUARD"
          node --test "$T/.claude/hooks/block-hook-bypass.test.js"
          bash "$T/scripts/secret-guard-selftest.sh"
