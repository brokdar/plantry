name: Frontend

# Checks and unit tests run as parallel jobs. Timeouts are frozen tripwires
# (test-budget.json), never the fix for slow tests.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'test-budget.json'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, knip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Knip and legacy patterns
        run: bun run knip && bun run check:legacy

  test:
    name: Unit tests (wall budget)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Vitest
        run: bunx vitest run --reporter=default --reporter=json --outputFile.json=/tmp/vitest.json
      - uses: actions/setup-go@v5 # scripts/calibrate.go: the budget is scaled by the runner's speed
        with:
          go-version: "1.25"
          cache: false
      - name: Wall budget
        run: TEST_BUDGET_SEED=1 TEST_BUDGET_CALIB="$(go run ../scripts/calibrate.go)" python3 ../scripts/test-budget.py vitest /tmp/vitest.json
