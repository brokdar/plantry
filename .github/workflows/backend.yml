name: Backend

# Three parallel jobs, each well inside its budget (test-budget.json). The
# timeouts below are tripwires for hangs, never the fix for slow tests: they
# are frozen in test-budget.json (scripts/test-budget.py timeouts).
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'test-budget.json'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Go checks (vet, lint, builds, sqlc, deadcode, budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # budget diff against origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          golangci-lint run
      - name: Cross builds (arm64, armv7, no CGO)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/plantry
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/plantry
      - name: Install sqlc
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo mv /tmp/sqlc /usr/local/bin/sqlc
      - name: sqlc generate (no drift)
        run: |
          sqlc generate
          git diff --exit-code internal/adapters/sqlite/sqlcgen/
      - name: Every sqlc query has a caller
        run: ./scripts/check-sqlc-usage.sh
      - name: No dead code
        run: |
          out="$(go tool deadcode -test ./... | grep -v '/sqlcgen/' || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Test patterns, timeouts, budget raises carry a reason
        run: |
          bash ../scripts/check-test-patterns.sh
          python3 ../scripts/test-budget.py timeouts
          python3 ../scripts/test-budget.py diff origin/main

  test:
    name: go test (no race, CPU budget)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: go test
        run: GO_TEST_CPU_LOG=/tmp/cpu.jsonl go test -count=1 -json -exec "$PWD/../scripts/cpu-exec.py" ./... > /tmp/go-test.json
      - name: Failures
        if: failure()
        run: grep -E '"Action":"(fail|output)"' /tmp/go-test.json | grep -E 'FAIL|Error|panic' | head -60
      - name: CPU budget (tests may get slower only with the tests added)
        run: python3 ../scripts/test-budget.py go /tmp/go-test.json /tmp/cpu.jsonl

  race:
    name: go test -race -short (CPU budget)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum
      # The SQLite engine (C translated to Go) is not race-instrumented: it
      # was 60% of the race CPU, and our own code stays instrumented.
      - name: go test -race -short
        env:
          CGO_ENABLED: "1"
        run: GO_TEST_CPU_LOG=/tmp/cpu.jsonl go test -race -short -gcflags='modernc.org/sqlite/...=-race=false' -timeout 5m -count=1 -json -exec "$PWD/../scripts/cpu-exec.py" ./... > /tmp/go-race.json
      - name: Failures
        if: failure()
        run: grep -E '"Action":"(fail|output)"' /tmp/go-race.json | grep -E 'FAIL|Error|panic|DATA RACE' | head -60
      - name: CPU budget
        run: python3 ../scripts/test-budget.py race /tmp/go-race.json /tmp/cpu.jsonl
